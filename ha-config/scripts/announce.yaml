# script.announce -- ONE place that knows where spoken alerts go.
#
# Automations call this rather than naming a media_player, so the target can change (Nest Mini, the
# wall Pi's 3.5mm output, a future speaker) without touching every automation.
#
# Target: media_player.family_room_speaker, a Google Nest Mini. The Cast integration discovers these
# automatically -- no setup was required. The name comes from Google Home, not from HA.
#
# Engine: Nabu Casa Cloud (Azure neural voices). Google Translate TTS was tried first and sounded
# slow -- not latency (both start speaking in about a second) but the voice's own flat delivery.
# Cloud needs the internet; if announcements must survive an outage, Piper running locally is the
# swap, and this script is the only place that would change.
#
# NO CHIME. A two-tone chime was built and abandoned: a Nest Mini plays MEDIA far quieter than
# announcements, Cast does NOT support announce mode (MEDIA_ANNOUNCE is unsupported, so the flag is
# accepted and ignored), and making the file louder cannot close the gap -- at -8.8 LUFS it was
# eleven dB HOTTER than the TTS that sounded fine, and still faint. The Reolink chime already rings
# a real doorbell tune on a press (select.reolink_chime_visitor_ringtone), which is the right device
# for a chime anyway.
alias: Announce
description: Speak a message on the house announcement speaker
mode: queued
max: 10
fields:
  message:
    name: Message
    description: What to say
    required: true
    selector:
      text:
  voice:
    name: Voice
    description: Cloud voice id, e.g. JennyNeural, AriaNeural, AndrewNeural
    selector:
      text:
  volume:
    name: Volume
    description: 0.0-1.0
    selector:
      number:
        min: 0
        max: 1
        step: 0.05
sequence:
  # A Nest Mini keeps whatever level it was last left at, which may be a level someone chose for
  # music rather than for an alert.
  - service: media_player.volume_set
    target:
      entity_id: media_player.family_room_speaker
    data:
      volume_level: "{{ volume | default(0.55) }}"
  # Let the level land before speaking -- playback can otherwise start at the previous volume.
  - delay: "00:00:01"
  - service: tts.speak
    target:
      entity_id: tts.home_assistant_cloud
    data:
      media_player_entity_id: media_player.family_room_speaker
      message: "{{ message }}"
      options:
        voice: "{{ voice | default('JennyNeural') }}"
