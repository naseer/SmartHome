# script.cast_wall_stop -- stop casting and release the Cast device.
#
# turn_off rather than media_stop: the Lovelace receiver keeps the device claimed after a stop, so
# the TV would stay on an idle Home Assistant screen instead of returning to its normal input.
alias: Stop casting the wall display
description: Stop the wall dashboard cast and release the device
mode: single
icon: mdi:cast-off
fields:
  target:
    name: Cast target
    description: Which Cast device to stop
    required: false
    example: media_player.family_room_tv
    selector:
      entity:
        filter:
          domain: media_player
sequence:
  - action: media_player.turn_off
    target:
      entity_id: "{{ target | default('media_player.family_room_tv', true) }}"
