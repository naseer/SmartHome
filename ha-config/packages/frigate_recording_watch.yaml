template:
  - binary_sensor:
      - name: Frigate recording stalled
        unique_id: frigate_recording_stalled
        device_class: problem
        # `unavailable`/`unknown` MUST count as stalled. The nine-day outage had Frigate entirely
        # gone, which makes these sensors unavailable rather than large -- treating that as "fine"
        # would miss the exact failure this was built for.
        state: >-
          {% set ns = namespace(bad=false) %}
          {% for c in 'driveway', 'driveway_tele', 'front_door', 'west_gate', 'east_gate', 'backyard' %}
            {% set s = states('sensor.frigate_' ~ c ~ '_recording_age') %}
            {% if s in ['unknown','unavailable','none','None',''] or (s | float(9999)) > 600 %}
              {% set ns.bad = true %}
            {% endif %}
          {% endfor %}
          {{ ns.bad }}
        attributes:
          stale: >-
            {% set ns = namespace(l=[]) %}
            {% for c in 'driveway', 'driveway_tele', 'front_door', 'west_gate', 'east_gate', 'backyard' %}
              {% set s = states('sensor.frigate_' ~ c ~ '_recording_age') %}
              {% if s in ['unknown','unavailable','none','None',''] %}
                {% set ns.l = ns.l + [c ~ ' (no answer)'] %}
              {% elif (s | float(9999)) > 600 %}
                {% set ns.l = ns.l + [c ~ ' (' ~ ((s | float(0)) / 60) | round(0) | int ~ 'm)'] %}
              {% endif %}
            {% endfor %}
            {{ ns.l | join(', ') if ns.l else 'none' }}

automation:
  - alias: Frigate recording stalled
    id: frigate_recording_stalled_alert
    mode: single
    # 15 minutes of patience: a frigate restart blanks recordings for ~90 s and an HA restart leaves
    # these sensors unknown briefly. Neither should page anyone.
    trigger:
      - platform: state
        entity_id: binary_sensor.frigate_recording_stalled
        to: 'on'
        for: '00:15:00'
        id: stalled
      - platform: state
        entity_id: binary_sensor.frigate_recording_stalled
        to: 'off'
        for: '00:05:00'
        id: recovered
      # Re-nag every 6 hours while still broken, so a fault cannot be dismissed once and forgotten.
      - platform: time_pattern
        hours: '/6'
        id: renag
    # `trigger.id | default(...)` throughout: without it a MANUAL trigger raises on the undefined
    # `trigger`, which makes the alert impossible to test. An alert nobody can test is how the
    # 25-hour outage went unnoticed in the first place -- so this stays testable on purpose.
    condition: >-
      {{ trigger.id | default('manual') != 'renag'
         or is_state('binary_sensor.frigate_recording_stalled','on') }}
    action:
      - variables:
          tid: "{{ trigger.id | default('manual') }}"
          stale: "{{ state_attr('binary_sensor.frigate_recording_stalled','stale') or 'test' }}"
          msg: >-
            {% if tid == 'recovered' %}
              Frigate recording is back to normal.
            {% else %}
              No new recordings from: {{ stale }}. Footage is being DISCARDED, not queued.
            {% endif %}
      - repeat:
          for_each:
            - notify.mobile_app_mna
            - notify.mobile_app_zaid_s_pixel
          sequence:
            - service: "{{ repeat.item }}"
              data:
                title: >-
                  {{ 'Frigate recording recovered' if tid == 'recovered' else 'Frigate is NOT recording' }}
                message: "{{ msg }}"
                data:
                  # Android: keep the fault visible until acted on, and let the recovery replace it
                  # rather than stack a second card.
                  tag: frigate_recording
                  channel: Frigate
                  importance: high
                  sticky: "{{ 'false' if tid == 'recovered' else 'true' }}"
                  color: "{{ '#2e7d32' if tid == 'recovered' else '#c62828' }}"
