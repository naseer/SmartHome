# Frigate recording-freshness watch.
#
# WHY THIS EXISTS: on 2026-09-01 Frigate was found to have written NO RECORDINGS FOR 25 HOURS.
# Segments were still being produced into /tmp/cache the whole time and then silently DISCARDED
# (see masn-stack/OPEN-THREADS.md). Nobody noticed. The week before, Frigate was down for NINE DAYS
# after a power cut, and nobody noticed that either.
#
# WHAT MAKES THIS HARD, AND WHY IT WATCHES RECORDINGS RATHER THAN ANYTHING EASIER: during those 25
# hours EVERY obvious health signal was perfect. The container reported `healthy`. /api/stats
# answered in under 2 s on 40 consecutive polls. camera_fps sat at 5.0-5.1 on all six cameras and
# skipped_fps at 0.0, because the cameras genuinely were streaming and detection genuinely was
# running -- only the write to disk was broken. A watchdog on fps, on the API, or on container
# health would have reported everything fine for 25 hours. The ONLY signal that tells the truth is
# whether new recording segments are actually landing.
#
# Polls the newest segment per camera over a 15-minute window. No segments in that window (or an
# unreachable Frigate, which makes the sensor unavailable) is a fault.
#
# 9999 is the "no segments at all" sentinel -- it reads as ~2.8 hours and is deliberately far past
# any threshold, so a missing answer can never be mistaken for a fresh one.

rest:
  - resource_template: >-
      http://192.168.50.200:5000/api/driveway/recordings?after={{ (now().timestamp() - 900) | int }}&before={{ now().timestamp() | int }}
    scan_interval: 300
    timeout: 25
    sensor:
      - name: Frigate driveway recording age
        unique_id: frigate_recording_age_driveway
        unit_of_measurement: s
        state_class: measurement
        value_template: >-
          {% set ends = (value_json or []) | map(attribute='end_time') | list %}
          {% if ends | length > 0 %}
            {{ [ (now().timestamp() - (ends | max)), 0 ] | max | round(0) }}
          {% else %}
            9999
          {% endif %}

