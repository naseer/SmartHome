# /etc/wall-tiles.conf -- where each camera tile's burnt-in OSD CLOCK sits on the 3840x2160 wall.
#
# Format:  <name>  <x>,<y> <width>x<height>        (grim -g geometry)
#
# These are LAYOUT-DEPENDENT. Rearranging the dashboard moves them, and a stale region silently
# points at scenery instead of a clock -- which reads as "frozen" forever, or "live" forever,
# depending on where it lands. After any layout change re-verify with:
#     wallpi-stack/tools/show-osd-regions.sh
#
# Verified 2026-08-18 against the layout-card 3x3 grid:
#     drive drive info
#     drive drive west
#     back  east  front
#
# front_door MOVED from the top-right cell to the bottom-right when the info panel was moved up,
# so its region shifted by one cell height (+1440). Everything else stayed put.
#
# front_door is back: it is rendered with `fit: contain`, which keeps its whole frame including the
# OSD clock. (While it was briefly on `cover` the clock was cropped away and this entry had to be
# removed -- a region with no clock never changes, which tile-watchdog would read as permanently
# frozen and act on every cooldown period, forever.)

driveway    800,30    950x75
front_door  3040,1448 320x40
west_gate   3000,738  400x44
east_gate   1715,1450 390x46
backyard    425,1452  420x44
