# /etc/wall-tiles.conf -- where each camera's burnt-in OSD CLOCK sits on the wall.
#
# Format:  <name>  <x>,<y> <width>x<height>        (grim -g geometry)
#
# THE WALL NOW RENDERS ONE COMPOSITED STREAM, not five video elements (see orin-stack/wall-grid).
# All five clocks still appear -- they are burnt into the sub-images the Orin stitches together --
# but they now live inside a single 1920x1080 frame upscaled to the 2560x1440 panel.
#
# MODE MATTERS: with one stream a stall freezes EVERY clock at once. tile-watchdog's usual safety
# rule ("only act when some tiles are live and others frozen") would therefore never fire. The
# directive below tells it that all-frozen is a real, actionable stall here.
mode single_stream

# Verified 2026-08-19 against the composited grid on a 2560x1440 panel:
#     driveway 1280x720 @ 0,0        [ info panel overlays the black cell at 1280,0 ]
#     west_gate @ 1280,360
#     backyard @ 0,720   east_gate @ 640,720   front_door @ 1280,720
# (video coordinates; multiply by 1.3333 for screen coordinates)

driveway    500,15    620x60
west_gate   1980,488  280x36
backyard    255,962   270x36
east_gate   1125,968  280x36
front_door  1980,968  280x36
