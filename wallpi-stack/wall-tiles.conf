# /etc/wall-tiles.conf -- where each camera tile's burnt-in OSD CLOCK sits on the 3840x2160 wall.
#
# Format:  <name>  <x>,<y> <width>x<height>        (grim -g geometry)
#
# These are LAYOUT-DEPENDENT. Rearranging the dashboard moves them, and a stale region silently
# points at scenery instead of a clock -- which reads as "frozen" forever, or "live" forever,
# depending on where it lands. After any layout change re-verify with:
#     wallpi-stack/tools/show-osd-regions.sh
#
# Verified 2026-08-17 against the layout-card 3x3 grid:
#     drive drive front
#     drive drive west
#     back  east  info
#
# NOTE ON front_door: it is the one tile rendered with `fit: contain` rather than `cover`,
# specifically BECAUSE cover cropped its clock away and left this watchdog blind to that tile.

driveway    800,30    950x75
front_door  3040,8    320x40
west_gate   3000,738  400x44
east_gate   1715,1450 390x46
backyard    425,1452  420x44
