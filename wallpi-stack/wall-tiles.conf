# /etc/wall-tiles.conf -- where each camera tile's burnt-in OSD CLOCK sits on the 3840x2160 wall.
#
# Format:  <name>  <x>,<y> <width>x<height>        (grim -g geometry)
#
# These are LAYOUT-DEPENDENT. Rearranging the dashboard moves them, and a stale region silently
# points at scenery instead of a clock -- which reads as "frozen" forever, or as "live" forever,
# depending on where it lands. After any layout change, re-verify with:
#     wallpi-stack/tools/show-osd-regions.sh
# which crops these exact regions and labels them so you can see the timestamps.
#
# Verified 2026-08-17 against the 3-column masonry (driveway spanning two columns).

driveway    800,30    950x75
front_door  2990,10   510x45
west_gate   2990,970  510x45
east_gate   440,1480  520x45
backyard    1760,1470 520x45
