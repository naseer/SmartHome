# /etc/asound.conf -- system-wide ALSA default for the wall display Pi.
#
# WHY THIS FILE EXISTS: without it there is no usable `default` PCM on this box, so anything that
# just opens "default" (gmediarender, aplay, HA announcements) either fails or lands on the wrong
# card. Every player has to pass -D explicitly, which is exactly the kind of thing that gets
# forgotten and then reads as "audio is broken".
#
# CHOICE OF SINK: card 0, the Pi's own 3.5mm jack, so the speaker is independent of the monitor --
# the display can be swapped without silencing announcements.
#
# TO SEND AUDIO TO THE MONITOR OVER HDMI INSTEAD: change card 0 -> card 1 in both blocks below.
# Both were verified working on 2026-08-17:
#     card 0 (bcm2835 Headphones, 3.5mm)  S16_LE @ 48000
#     card 1 (vc4hdmi0, PG32UCDM)         IEC958_SUBFRAME_LE @ 48000
#
# NOTE THE `plug`. The HDMI device accepts ONLY IEC958_SUBFRAME_LE (S/PDIF framing) -- opening
# hw:1,0 directly with ordinary S16_LE fails with "Sample format not available", which is what made
# HDMI audio look dead for weeks. `plug` inserts the conversion. Keep it even for the analog card:
# it costs nothing and makes any sample rate or format work.

pcm.!default {
    type plug
    slave.pcm "hw:0,0"
}

ctl.!default {
    type hw
    card 0
}
