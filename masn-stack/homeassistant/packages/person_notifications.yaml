# Camera / doorbell notifications.
#  1) Frigate person detection -> snapshot to the whole household (mna + Sara + son's pixel_8_pro).
#  2) Reolink doorbell button press (binary_sensor.outside_doorbell_visitor off->on) -> high-priority
#     alert with the front-door snapshot to the whole household (mna + Sara + son's pixel_8_pro).
#  Both carry ACTION BUTTONS: "Live view" (URI -> Cameras tab) + "Light on" (turns on that camera's
#  floodlight; front_door -> porch potlights) via the notification_action_light automation. Siren omitted.
# Deployed to /opt/stack/homeassistant/config/packages/ (config/ is gitignored, so this repo copy
# is the source of truth -- redeploy after editing). Loaded via `packages: !include_dir_named packages/`.

# Fetch a single Frigate event (incl. data.path_data) from the localhost-only internal API. Used by the
# moving-vehicle automation to judge trajectory directness. HA is host-network so 127.0.0.1:5000 works.
rest_command:
  frigate_get_event:
    url: "http://127.0.0.1:5000/api/events/{{ event_id }}"
    method: GET

automation:
  # Event-driven (MQTT frigate/events): the event carries the Frigate EVENT id (snapshot = the actual
  # detection, tap = that event's clip) AND `entered_zones`. We notify ONLY when a person FIRST enters
  # one of the user-drawn property ZONES (before had no zones, after does) -> neighbour/street/decoy
  # detections OUTSIDE the zones never notify. This zone gate is what makes the per-camera object masks
  # redundant for alerting (they now only keep known decoys out of the event list). Note: Frigate's own
  # "alert" severity was NOT a reliable gate here -- some alerts fired with zones=[] -- so we test
  # entered_zones directly. driveway_tele has detection disabled, so it never produces person events.
  - id: frigate_person_notifications
    alias: "Frigate: person detected"
    mode: parallel
    max: 10
    trigger:
      - platform: mqtt
        topic: frigate/events
    condition:
      - condition: template
        value_template: >
          {% set a = trigger.payload_json['after'] %}
          {% set b = trigger.payload_json['before'] %}
          {{ a['label'] == 'person'
             and (a['entered_zones'] | default([])) | count > 0
             and ((b['entered_zones'] | default([])) if b else []) | count == 0 }}
    variables:
      id: "{{ trigger.payload_json['after']['id'] }}"
      camera: "{{ trigger.payload_json['after']['camera'] }}"
      cam_name: "{{ camera | replace('_', ' ') | title }}"
    action:
      - repeat:
          for_each:
            - notify.mobile_app_mna
            - notify.mobile_app_sara_phone
            - notify.mobile_app_pixel_8_pro
          sequence:
            - service: "{{ repeat.item }}"
              data:
                title: "Person detected"
                message: "Person at {{ cam_name }}"
                data:
                  image: "/api/frigate/notifications/{{ id }}/snapshot.jpg"
                  tag: "{{ id }}"
                  channel: "Person detection"
                  clickAction: "/api/frigate/notifications/{{ id }}/{{ camera }}/clip.mp4"
                  actions:
                    - action: "URI"
                      title: "Live view"
                      uri: "/lovelace/cameras"
                    - action: "light_{{ camera }}"
                      title: "Light on"

  # Doorbell button PRESS (the physical bell) -> high-priority alert to the household phones.
  - id: doorbell_pressed_notification
    alias: "Doorbell: pressed"
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.outside_doorbell_visitor
        from: "off"
        to: "on"
    action:
      - repeat:
          for_each:
            - notify.mobile_app_mna
            - notify.mobile_app_sara_phone
            - notify.mobile_app_pixel_8_pro
          sequence:
            - service: "{{ repeat.item }}"
              data:
                title: "Doorbell"
                message: "Someone is at the front door"
                data:
                  image: "/api/camera_proxy/camera.front_door"
                  tag: "doorbell-press"
                  channel: "Doorbell"
                  importance: high
                  priority: high
                  ttl: 0
                  clickAction: "/lovelace/cameras"
                  actions:
                    - action: "URI"
                      title: "Live view"
                      uri: "/lovelace/cameras"
                    - action: "light_front_door"
                      title: "Porch light"

  # Handles the "Light on" / "Porch light" action buttons above. The action id is "light_<camera>";
  # we strip the prefix and turn on that camera's floodlight (front_door has none -> porch potlights).
  # "Live view" uses a URI action (opened by the app directly, no automation). Siren buttons omitted.
  - id: notification_action_light
    alias: "Notification action: light on"
    mode: parallel
    max: 10
    trigger:
      - platform: event
        event_type: mobile_app_notification_action
    variables:
      cam: "{{ trigger.event.data.action[6:] }}"
      light_map:
        driveway: light.garage_floodlight
        west_gate: light.west_floodlight
        east_gate: light.east_floodlight
        backyard: light.backyard_floodlight
        front_door: light.smart_wi_fi_dimmer_switch_4
      target_light: "{{ light_map.get(cam, 'none') }}"
    condition:
      - "{{ (trigger.event.data.action | default('')).startswith('light_') }}"
      - "{{ target_light != 'none' }}"
    action:
      - service: light.turn_on
        target:
          entity_id: "{{ target_light }}"

  # Moving-VEHICLE notification (car/bus/motorcycle). Speed metrics were abandoned: a PARKED car's box
  # FLICKERS between two fixed spots (e.g. two cars nearby), fabricating a steady 5-11 km/h estimated
  # speed -- so neither instantaneous nor AVERAGE speed can tell flicker from a real slow car. The one
  # thing flicker can't fake is DIRECTION. So we gate on TRAJECTORY DIRECTNESS: pre-filter on entering
  # the speed-gated driveway_lane, wait ~8s for the track to accumulate points, pull the event's
  # path_data from Frigate, and fire only if the path is roughly STRAIGHT -- net displacement / total
  # path length >= 0.5 AND net >= 0.1. Real cars travel in a line (ratio ~1.0); parked-car flicker
  # oscillates in place (ratio <= 0.13). Costs an ~8s alert delay (fine for "a car is arriving").
  # To naseer (mna). Tune net>=0.1 / ratio>=0.5 if a real arrival is missed or flicker sneaks through.
  - id: frigate_vehicle_notifications
    alias: "Frigate: moving vehicle"
    mode: parallel
    max: 10
    trace:
      stored_traces: 25
    trigger:
      - platform: mqtt
        topic: frigate/events
    condition:
      - condition: template
        value_template: >
          {% set a = trigger.payload_json['after'] %}
          {% set b = trigger.payload_json['before'] %}
          {{ a['label'] in ['car', 'bus', 'motorcycle']
             and 'driveway_lane' in (a['entered_zones'] | default([]))
             and 'driveway_lane' not in ((b['entered_zones'] | default([])) if b else []) }}
    variables:
      id: "{{ trigger.payload_json['after']['id'] }}"
      camera: "{{ trigger.payload_json['after']['camera'] }}"
      cam_name: "{{ camera | replace('_', ' ') | title }}"
      label: "{{ trigger.payload_json['after']['label'] | title }}"
    action:
      # Let the track accumulate a few points, then judge its SHAPE from Frigate's path_data.
      - delay: {seconds: 8}
      - service: rest_command.frigate_get_event
        data:
          event_id: "{{ id }}"
        response_variable: ev
      - variables:
          fire: >
            {% set c = ev.content if (ev is defined and ev.status | default(0) == 200) else none %}
            {% if c is string %}{% set c = c | from_json %}{% endif %}
            {% set pd = (c.data.path_data) if (c is mapping and c.get('data') and c.data.get('path_data')) else [] %}
            {% if pd | length < 2 %}false
            {% else %}
              {% set ns = namespace(total=0.0, prev=None) %}
              {% for p in pd %}
                {% set xy = p[0] %}
                {% if ns.prev is not none %}
                  {% set ns.total = ns.total + ((xy[0]-ns.prev[0])**2 + (xy[1]-ns.prev[1])**2)**0.5 %}
                {% endif %}
                {% set ns.prev = xy %}
              {% endfor %}
              {% set f = pd[0][0] %}{% set l = pd[-1][0] %}
              {% set net = ((l[0]-f[0])**2 + (l[1]-f[1])**2)**0.5 %}
              {{ net >= 0.1 and ns.total > 0 and (net / ns.total) >= 0.5 }}
            {% endif %}
      - condition: "{{ fire | trim | bool }}"
      - service: notify.mobile_app_mna
        data:
          title: "Vehicle detected"
          message: "{{ label }} moving at {{ cam_name }}"
          data:
            image: "/api/frigate/notifications/{{ id }}/snapshot.jpg"
            tag: "{{ id }}"
            channel: "Vehicle detection"
            clickAction: "/api/frigate/notifications/{{ id }}/{{ camera }}/clip.mp4"
            actions:
              - action: "URI"
                title: "Live view"
                uri: "/lovelace/cameras"
              - action: "light_{{ camera }}"
                title: "Light on"
