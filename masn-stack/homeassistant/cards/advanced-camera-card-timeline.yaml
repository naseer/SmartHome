# SUPERSEDED 2026-08-11 -- kept for the findings, NOT as a recommended config.
#
# OUTCOME: the HA card cannot reproduce Frigate's scrubbing, and the reason is structural rather
# than configurable. Frigate's own UI scrubs low-res PREVIEW clips (1757 of them, 6.5 GB against
# 3.2 TB of recordings, ~500x smaller). The card fetches REAL recordings -- clicking the timeline
# loaded a 35-MINUTE 4K HEVC segment, which is the "slow" everyone was feeling.
#
# DECISION: use Frigate's own UI at http://orin.internal:8971 as a browser bookmark, logged in as
# the existing `westacott` account (role: viewer, so view-only). Sessions last 24 h and refresh.
# The HA iframe view was REMOVED -- it asked for a login on every load because an HTTP iframe inside
# an HTTPS page cannot keep its cookie, and it never worked away from home because the browser has
# to reach the Orin directly.
#
# Remote scrubbing remains unsolved and needs network-level access (VPN/tunnel), both declined.
# Remote LIVE view is fine since the sub-stream change of 2026-08-09.
#
# ALSO RULED OUT: proxying Frigate's UI through HA. The Frigate integration proxies MEDIA only
# (snapshots/recordings/vod/jsmpeg/mse/webrtc), not the UI. hass-web-proxy-integration serves the
# HTML but the SPA requests assets by ABSOLUTE path (/assets/...), which resolve against HA's origin
# and 404. Verified: proxied HTML 200/6833 bytes, its own main.js 404 from HA and 200 via the proxy.
#
# Advanced Camera Card -- scrubbing-focused config, for the Cameras dashboard.
#
# WHY: the stock Frigate/HA camera card has a poor scrubbing experience and pulls FULL recordings.
# Measured 2026-08-10: recordings run 4-6 Mbps and are 4K HEVC on driveway/west_gate/east_gate and
# 4608x1728 on backyard. HEVC is badly supported in browsers, so something has to transcode it --
# that is the "slow recordings" symptom, and bandwidth is only half of it.
#
# Frigate already solves this for its OWN UI: it generates low-res PREVIEW clips specifically for
# timeline scrubbing. Measured on the Orin: 1757 preview clips totalling 6.5 GB, against 3.2 TB of
# recordings -- roughly 500x smaller. Scrubbing should read previews and only fetch a real recording
# when you stop and play. This card's `timeline` view is the way to get that behaviour inside HA.
#
# Remote access works because the Frigate integration (v5.15.4) ships hass-web-proxy-lib, so media is
# proxied THROUGH Home Assistant. Nothing on the Orin needs exposing -- :8971 and :5000 stay put.
#
# PASTE THIS as a Manual card. `camera_entity` and the `camera` name must match your entities.
# UNVERIFIED: the dashboard lives in HA's .storage, which is root-owned and not readable from this
# repo, so this was not diffed against what you currently have. Treat it as a starting point.

type: custom:advanced-camera-card
cameras:
  - camera_entity: camera.driveway
    frigate:
      camera_name: driveway
    # Live from the SUB stream -- the same reason live view was repointed on 2026-08-09. The main
    # feed is 4K HEVC and was being pushed in full whenever a card opened.
    live_provider: go2rtc
    go2rtc:
      modes: [webrtc, mse]      # webrtc first (lowest latency), mse as the fallback
      stream: driveway_sub
  - camera_entity: camera.front_door
    frigate: {camera_name: front_door}
    live_provider: go2rtc
    go2rtc: {modes: [webrtc, mse], stream: front_door_sub}
  - camera_entity: camera.west_gate
    frigate: {camera_name: west_gate}
    live_provider: go2rtc
    go2rtc: {modes: [webrtc, mse], stream: west_gate_sub}
  - camera_entity: camera.east_gate
    frigate: {camera_name: east_gate}
    live_provider: go2rtc
    go2rtc: {modes: [webrtc, mse], stream: east_gate_sub}
  - camera_entity: camera.backyard
    frigate: {camera_name: backyard}
    live_provider: go2rtc
    go2rtc: {modes: [webrtc, mse], stream: backyard_sub}

# ---------------------------------------------------------------------------------------------
# LAYOUT -- this is what was actually wrong on the phone (screenshot 2026-08-10 19:50).
#
# SYMPTOM: the camera image filled only ~a third of the card, with large black bands above and
# below, and the timeline sat flush against the iOS home indicator (easy to hit by accident).
#
# CAUSE: the dashboard view is almost certainly in **Panel (1 card)** mode. Panel stretches a single
# card to the FULL viewport height. The video keeps its own aspect ratio inside that tall box, so
# the leftover space becomes black bands, and the timeline gets shoved to the very bottom edge.
# It is not a card bug and no card setting fully compensates for it.
#
# FIX, in the dashboard rather than here: edit the view (pencil -> the view's cog) and set its type
# to **Sections** or **Masonry** instead of Panel. The card then takes only the height it needs.
#
# The static aspect ratio below is the belt-and-braces half: it stops the card claiming more height
# than the video needs even if the view type is left alone. driveway_sub is 896x512 (~16:9); the
# other subs are 640x480, 640x360 and 1536x576, so 16:9 is the closest single value that suits the
# set. Use `unconstrained` only in Sections/Masonry, never in Panel.
dimensions:
  aspect_ratio_mode: static
  aspect_ratio: '16:9'

view:
  # `live` opens on the camera; the timeline is then one tap on the menu bar. Switch this to
  # `timeline` if you would rather the card OPEN on the scrubber -- reasonable if reviewing is what
  # you mostly do on a phone, at the cost of not seeing a live image first.
  default: live
  camera_select: current
  # Keep the chosen view when you switch cameras, so scrubbing camera A then jumping to camera B
  # lands you on B's timeline rather than dumping you back to live.
  update_cycle_camera: false

# The timeline is the point of this card. `events_media_type: all` puts both clips and recordings on
# one bar so you can drag across time rather than hunting through an event list.
timeline:
  # `stack` gives taller, easier-to-hit targets than `ribbon`, which is a single thin strip -- the
  # thing that made the bar awkward to use on a phone. Switch back to `ribbon` if you prefer compact.
  style: stack
  window_seconds: 7200          # 2 h visible; wider window = less dragging to find something
  clustering_threshold: 3
  events_media_type: all
  show_recordings: true

media_viewer:
  auto_play: selected
  auto_unmute: never            # browsers block autoplay WITH sound; muted start avoids a stall
  lazy_load: true
  transition_effect: none

# DISCOVERABILITY IS THE POINT HERE. An earlier draft of this file used `style: hidden`, which
# tucks the menu behind a hover/swipe -- wrong when the complaint is literally "I don't even see an
# option to scrub". `outside` keeps the bar visible so the timeline button is always on screen.
menu:
  style: outside
  position: bottom
  buttons:
    timeline: {enabled: true, priority: 100, alignment: matching}
    media_player: {enabled: true}
    cameras: {enabled: true}
    live: {enabled: true}
    clips: {enabled: true}
    snapshots: {enabled: true}
    # Off: they crowd the bar on a phone and none of them help you scrub.
    fullscreen: {enabled: false}
    download: {enabled: false}
    camera_ui: {enabled: false}

performance:
  features:
    animated_progress_indicator: false
    media_chunk_size: 20        # smaller pages = faster first paint over a relay
  style:
    box_shadow: false
    border_radius: false
