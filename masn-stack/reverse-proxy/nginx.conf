# TLS front door for Home Assistant, so Cast devices can reach it over https ON THE LAN.
#
# WHY THIS EXISTS: Home Assistant Cast picks its own URL with
#     get_url(hass, require_ssl=True, prefer_external=True)
# -- https REQUIRED, external PREFERRED. With external_url set to the Nabu Casa address the Cast
# device pulled the dashboard and all five camera streams from the cloud: 2.8 Mbit/s upstream off
# masn with a standing 7.5 kB send-queue backlog, measured 2026-09-21, which was the TV buffering.
# Pointing external_url at ha.naseer.dev (a PUBLIC name resolving to the PRIVATE 192.168.50.50)
# keeps that traffic on the LAN while still satisfying require_ssl.
#
# WHY A PROXY INSTEAD OF TLS INSIDE HOME ASSISTANT: about a dozen things speak plain http to
# 192.168.50.50:8123 or 127.0.0.1:8123 -- the wall Pi kiosk URL, masjid-prayer-times.py,
# apply-dashboard.sh, ha-reload.sh and every ad-hoc diagnostic. Turning on HA's own ssl_certificate
# would break all of them at once for no gain. HA stays plain http; this terminates TLS beside it.
#
# WHY NOT A PUBLIC DNS NAME THAT RESOLVES SPLIT-HORIZON: Chromecast devices are documented to ignore
# DHCP-supplied DNS and query Google's resolvers directly, so a LAN-only override would never reach
# the TV. A public record pointing at a private address is the thing that actually works.

# Home Assistant is a websocket app; without this the frontend connects and then hangs.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    http2 on;
    server_name ha.naseer.dev;

    ssl_certificate     /certs/ha.naseer.dev/fullchain.pem;
    ssl_certificate_key /certs/ha.naseer.dev/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # Camera streams are long-lived and latency-sensitive; buffering them here reintroduces exactly
    # the lag this change exists to remove.
    proxy_buffering off;
    client_max_body_size 128M;

    location / {
        proxy_pass http://127.0.0.1:8123;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        # A stalled camera stream must not be cut at nginx's default 60s.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# No :80 server. The whole .dev TLD is HSTS-preloaded, so browsers refuse plain http on it
# unconditionally -- a redirect would never be requested, and opening :80 only adds surface.
