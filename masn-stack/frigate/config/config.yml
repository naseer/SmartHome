# Frigate -- 2 cameras (Driveway + Front Door) with PERSON detection. OpenVINO on the HD 630 iGPU.
# Recordings -> NAS SMB share, mounted at /mnt/nas/frigate (see tools/mount-nas-frigate.sh),
# bound into the container as /media/frigate. 24/7 CONTINUOUS retention for a Ring-style timeline.
# Add the other 3 cameras + car/tele lens later by extending go2rtc + cameras.

mqtt:
  host: mosquitto            # Frigate is BRIDGED -> reach the broker by service name, NOT 127.0.0.1
  port: 1883
  user: '{FRIGATE_MQTT_USER}'
  password: '{FRIGATE_MQTT_PASSWORD}'

# UI on :8971 served over plain HTTP (trusted LAN admin tool). Removes the self-signed-cert
# "Not Secure"/strikethrough warning. Put behind a reverse proxy for real TLS if ever exposed.
tls:
  enabled: false

detectors:
  ov:
    type: openvino
    device: GPU               # HD 630 iGPU via /dev/dri

# Frigate 0.17 requires an explicit model path for OpenVINO (bundled in the image).
model:
  width: 300
  height: 300
  input_tensor: nhwc
  input_pixel_format: bgr
  path: /openvino-model/ssdlite_mobilenet_v2.xml
  labelmap_path: /openvino-model/coco_91cl_bkgr.txt

ffmpeg:
  hwaccel_args: preset-vaapi  # HD 630 VAAPI decode (LIBVA_DRIVER_NAME=iHD set in compose)

# NAS-backed retention: 15 days of gapless 24/7 footage (scrub any moment, Ring-style),
# 30 days of review items. ~130 GB/day for these 2 cameras -> ~2 TB for 15 days (8 TB free).
# Revisit continuous.days when the other 3 cameras are added.
record:
  enabled: true
  preview:
    quality: high             # crisper timeline-scrub thumbnails (Ring-like smooth scrub)
  continuous:
    days: 15
  alerts:
    retain: {days: 30}
  detections:
    retain: {days: 30}

snapshots:
  enabled: true
  retain: {default: 14}

objects:
  # person + vehicles. This model has no "truck" label (larger vehicles read as car/bus), so the
  # vehicle set is car/bus/motorcycle. Zones still gate ALERTS -> a vehicle only "alerts" inside a
  # camera's required_zone. bicycle deliberately excluded (bike, more person-adjacent).
  track: [person, car, bus, motorcycle]

# go2rtc restream -- one connection per camera, re-shared to detect/record/live.
go2rtc:
  streams:
    driveway:                 # TrackMix WIDE lens, main (HEVC 4K) -> record + live
      - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.50.86:554/h264Preview_01_main
    driveway_sub:             # sub (h264 896x512) -> detect
      - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.50.86:554/h264Preview_01_sub
    front_door:               # doorbell main (h264 2560x1920) -> record + live
      - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.50.151:554/h264Preview_01_main
    front_door_sub:           # doorbell sub (h264 640x480) -> detect
      - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.50.151:554/h264Preview_01_sub
    west_gate:                # CX810 main (HEVC 4K) -> record + live
      - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.50.22:554/h264Preview_01_main
    west_gate_sub:            # sub (h264 640x360) -> detect
      - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.50.22:554/h264Preview_01_sub
    east_gate:                # CX810 main (HEVC 4K) -> record + live
      - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.50.130:554/h264Preview_01_main
    east_gate_sub:            # sub (h264 640x360) -> detect
      - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.50.130:554/h264Preview_01_sub
    backyard:                 # Duo 2 stitched main (HEVC 4608x1728) -> record + live
      - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.50.217:554/h264Preview_01_main
    backyard_sub:             # sub (h264 1536x576) -> detect
      - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.50.217:554/h264Preview_01_sub
    driveway_tele:            # TrackMix TELE lens ch02 (auto-tracked close-up, h264 1080p) -> record
      - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.50.86:554/h264Preview_02_main
    driveway_tele_sub:        # tele sub (h264 896x512) -> motion gate for event recording
      - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.50.86:554/h264Preview_02_sub

cameras:
  driveway:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/driveway
          input_args: preset-rtsp-restream
          roles: [record]
        - path: rtsp://127.0.0.1:8554/driveway_sub
          input_args: preset-rtsp-restream
          roles: [detect]
    detect:
      enabled: true             # 0.17 defaults this OFF
      width: 896
      height: 512
      fps: 5

    motion: {}
    zones:
      front_area:
        coordinates: 
          0.001,0.324,0.001,0.238,0.117,0.125,0.233,0.123,0.265,0.105,0.374,0.104,0.418,0.105,0.465,0.111,0.58,0.133,0.649,0.152,0.739,0.17,0.812,0.195,0.895,0.232,0.919,0.258,0.988,0.528,0.997,0.998,0.001,0.993
        loitering_time: 0
        friendly_name: Front Area
      # Speed-gated lane for MOVING-vehicle alerts. distances = real-world metres of each
      # side, in coordinate order: P1->P2 left/depth 9.5, P2->P3 street/width 6.5,
      # P3->P4 right/depth 9.5, P4->P1 garage/width 6.5 (driveway measured 6.5 x 9.5 m).
      # speed_threshold: an object only counts as "in" this zone while moving >= 5 km/h, so
      # parked cars (speed 0) are never in it -> the vehicle automation gates on entering here.
      driveway_lane:
        coordinates: 0.04,0.956,0.342,0.23,0.86,0.34,0.992,0.934
        distances: 9.5,6.5,9.5,6.5
        speed_threshold: 5
        loitering_time: 0
    review:
      alerts:
        required_zones: front_area
  front_door:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/front_door
          input_args: preset-rtsp-restream
          roles: [record]
        - path: rtsp://127.0.0.1:8554/front_door_sub
          input_args: preset-rtsp-restream
          roles: [detect]
    detect:
      enabled: true             # 0.17 defaults this OFF
      width: 640
      height: 480
      fps: 5
    motion: {}
    objects:
      filters:
        person:
          # Ignore "person" on the fixed object across the street (right side) that the MORNING
          # SUN lights up ~8am -> ~20 false hits at 0.7-0.85. Off the walkway/porch, so visitors are safe.
          mask: 0.70,0.24,0.97,0.24,0.97,0.58,0.70,0.58

  # west_gate / east_gate / backyard: promoted to 24/7 CONTINUOUS 2026-07-29 (inherit global
  # record.continuous.days: 15). Monitoring NAS storage growth for a few days before finalizing.
    zones:
      front_zone:
        coordinates: 
          0.003,0.684,0.161,0.622,0.413,0.622,0.58,0.614,0.753,0.593,0.814,0.584,0.98,0.608,0.995,0.656,0.995,0.997,0.001,0.999
        loitering_time: 0
        friendly_name: Front Zone
    review:
      alerts:
        required_zones: front_zone
  west_gate:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/west_gate
          input_args: preset-rtsp-restream
          roles: [record]
        - path: rtsp://127.0.0.1:8554/west_gate_sub
          input_args: preset-rtsp-restream
          roles: [detect]
    detect:
      enabled: true
      width: 640
      height: 360
      fps: 5
    motion: {}
    objects:
      filters:
        person:
          # Ignore "person" on the neighbour's GAS METER (fixed decoy, top-centre) -- it was
          # misclassified 0.7-0.85 at night. Covers the meter + surrounding neighbour strip.
          mask: 0.42,0.02,0.68,0.02,0.68,0.30,0.42,0.30
    zones:
      west_side_:
        coordinates: 
          0.794,0.179,0.719,0.187,0.676,0.195,0.658,0.208,0.637,0.217,0.501,0.258,0.084,0.377,0.004,0.445,0.001,0.992,0.918,0.998
        loitering_time: 0
        friendly_name: 'West Side '
    review:
      alerts:
        required_zones: west_side_
  east_gate:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/east_gate
          input_args: preset-rtsp-restream
          roles: [record]
        - path: rtsp://127.0.0.1:8554/east_gate_sub
          input_args: preset-rtsp-restream
          roles: [detect]
    detect:
      enabled: true
      width: 640
      height: 360
      fps: 5
    motion: {}
    zones:
      east_side:
        coordinates: 
          0.143,0.38,0.216,0.209,0.355,0.088,0.455,0.067,0.604,0.071,0.654,0.087,0.712,0.12,0.997,0.383,0.997,0.986,0.002,0.997,0.05,0.4
        loitering_time: 0
        friendly_name: East Side
    review:
      alerts:
        required_zones: east_side
  backyard:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/backyard
          input_args: preset-rtsp-restream
          roles: [record]
        - path: rtsp://127.0.0.1:8554/backyard_sub
          input_args: preset-rtsp-restream
          roles: [detect]
    detect:
      enabled: true
      width: 1536
      height: 576
      fps: 5
    motion: {}
    zones:
      backyard_zone:
        coordinates: 
          0.225,0.237,0.372,0.107,0.729,0.035,0.869,0.161,0.997,0.541,0.998,0.991,0.003,0.986,0.005,0.627
        loitering_time: 0
        friendly_name: backyard zone
    review:
      alerts:
        required_zones: backyard_zone
  driveway_tele:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/driveway_tele
          input_args: preset-rtsp-restream
          roles: [record]
        - path: rtsp://127.0.0.1:8554/driveway_tele_sub
          input_args: preset-rtsp-restream
          roles: [detect]
    detect:
      enabled: false
      width: 896
      height: 512
    record:
      enabled: true
      continuous:
        days: 0
      motion:
        days: 14
version: 0.17-0
