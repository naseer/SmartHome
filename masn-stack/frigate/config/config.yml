# Frigate -- 2 cameras (Driveway + Front Door) with PERSON detection. OpenVINO on the HD 630 iGPU.
# Recordings -> NAS SMB share, mounted at /mnt/nas/frigate (see tools/mount-nas-frigate.sh),
# bound into the container as /media/frigate. 24/7 CONTINUOUS retention for a Ring-style timeline.
# Add the other 3 cameras + car/tele lens later by extending go2rtc + cameras.

mqtt:
  host: mosquitto            # Frigate is BRIDGED -> reach the broker by service name, NOT 127.0.0.1
  port: 1883
  user: '{FRIGATE_MQTT_USER}'
  password: '{FRIGATE_MQTT_PASSWORD}'

# UI on :8971 served over plain HTTP (trusted LAN admin tool). Removes the self-signed-cert
# "Not Secure"/strikethrough warning. Put behind a reverse proxy for real TLS if ever exposed.
tls:
  enabled: false

detectors:
  ov:
    type: openvino
    device: GPU               # HD 630 iGPU via /dev/dri

# Frigate 0.17 requires an explicit model path for OpenVINO (bundled in the image).
model:
  width: 300
  height: 300
  input_tensor: nhwc
  input_pixel_format: bgr
  path: /openvino-model/ssdlite_mobilenet_v2.xml
  labelmap_path: /openvino-model/coco_91cl_bkgr.txt

ffmpeg:
  hwaccel_args: preset-vaapi  # HD 630 VAAPI decode (LIBVA_DRIVER_NAME=iHD set in compose)

# NAS-backed retention: 15 days of gapless 24/7 footage (scrub any moment, Ring-style),
# 30 days of review items. ~130 GB/day for these 2 cameras -> ~2 TB for 15 days (8 TB free).
# Revisit continuous.days when the other 3 cameras are added.
record:
  enabled: true
  preview:
    quality: high             # crisper timeline-scrub thumbnails (Ring-like smooth scrub)
  continuous:
    days: 15
  alerts:
    retain: {days: 30}
  detections:
    retain: {days: 30}

snapshots:
  enabled: true
  retain: {default: 14}

objects:
  track: [person]             # basic: person only (add car/package/etc later)

# go2rtc restream -- one connection per camera, re-shared to detect/record/live.
go2rtc:
  streams:
    driveway:                 # TrackMix WIDE lens, main (HEVC 4K) -> record + live
      - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.50.86:554/h264Preview_01_main
    driveway_sub:             # sub (h264 896x512) -> detect
      - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.50.86:554/h264Preview_01_sub
    front_door:               # doorbell main (h264 2560x1920) -> record + live
      - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.50.151:554/h264Preview_01_main
    front_door_sub:           # doorbell sub (h264 640x480) -> detect
      - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.50.151:554/h264Preview_01_sub
    west_gate:                # CX810 main (HEVC 4K) -> record + live
      - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.50.22:554/h264Preview_01_main
    west_gate_sub:            # sub (h264 640x360) -> detect
      - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.50.22:554/h264Preview_01_sub
    east_gate:                # CX810 main (HEVC 4K) -> record + live
      - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.50.130:554/h264Preview_01_main
    east_gate_sub:            # sub (h264 640x360) -> detect
      - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.50.130:554/h264Preview_01_sub
    backyard:                 # Duo 2 stitched main (HEVC 4608x1728) -> record + live
      - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.50.217:554/h264Preview_01_main
    backyard_sub:             # sub (h264 1536x576) -> detect
      - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.50.217:554/h264Preview_01_sub

cameras:
  driveway:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/driveway
          input_args: preset-rtsp-restream
          roles: [record]
        - path: rtsp://127.0.0.1:8554/driveway_sub
          input_args: preset-rtsp-restream
          roles: [detect]
    detect:
      enabled: true             # 0.17 defaults this OFF
      width: 896
      height: 512
      fps: 5

    motion:
