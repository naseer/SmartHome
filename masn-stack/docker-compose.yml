# masn home-server stack -- /opt/stack/docker-compose.yml
# Phase 0 (tomorrow): homeassistant + mosquitto + postgres come up clean.
# frigate / zigbee2mqtt are scaffolded but COMMENTED -- enable as hardware arrives.
# (Audio = NuTone IM-3303 + a standalone WiiM at the AUX; no audio container on masn.)
#
# Network model: HA is network_mode host (needs mDNS/SSDP). mosquitto + postgres publish ONLY to
# 127.0.0.1 so host-mode HA can reach them on localhost, without exposing them on the LAN.
# Bridged services (z2m) reach mosquitto by service name (mosquitto:1883) on the compose network.

services:
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    restart: unless-stopped
    network_mode: host              # mDNS/SSDP device discovery
    # --- ENABLE WHEN THE ZBT-2 THREAD DONGLE ARRIVES ---
    # privileged: true              # simplest path for radios + Bluetooth; tighten later
    # devices:                      # stable by-id path, never ttyACM*
    #   - /dev/serial/by-id/usb-...ZBT2-thread...:/dev/ttyThread   # Thread (OTBR/HA)
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./homeassistant/config:/config
      - /run/dbus:/run/dbus:ro
    depends_on: [mosquitto, postgres]

  mosquitto:
    container_name: mosquitto
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      # Two explicit bindings, NOT 0.0.0.0. Loopback keeps host-mode HA working unchanged
      # (its config entry points at 127.0.0.1); the LAN binding is what lets Frigate reach
      # the broker once it moves to the Orin. Deliberately NOT published on all interfaces,
      # which would also expose it on the tailnet.
      # Safe to expose: mosquitto.conf sets allow_anonymous false + password_file.
      - "127.0.0.1:1883:1883"
      - "${MASN_LAN_IP}:1883:1883"  # LAN only -> cross-box Frigate (see docs/orin-frigate-migration.md)
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log

  postgres:
    container_name: postgres
    image: postgres:16
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"       # localhost only (host-mode HA recorder reaches it here)
    environment:
      POSTGRES_DB: homeassistant
      POSTGRES_USER: "${PG_USER}"
      POSTGRES_PASSWORD: "${PG_PASSWORD}"
    volumes:
      - postgres:/var/lib/postgresql/data

  # Matter Server -- required for HA Matter (HA is a container, not HAOS, so no add-on).
  # host networking is required (mDNS + IPv6 device discovery). HA connects at ws://localhost:5580/ws.
  matter-server:
    container_name: matter-server
    image: ghcr.io/home-assistant-libs/python-matter-server:stable
    restart: unless-stopped
    security_opt:
      - apparmor=unconfined          # vendor-required for the CHIP stack (raw net/IPv6); documented trade-off
    network_mode: host
    command:
      - "--storage-path"
      - "/data"
      - "--listen-address"
      - "127.0.0.1"                   # WS control API (5580) localhost-ONLY; unauthenticated, so keep it off the LAN. Host-mode HA still reaches it. Matter device comms (mDNS/UDP) still use the LAN.
    volumes:
      - ./matter-server/data:/data
      # (no host D-Bus mount: W200 is Wi-Fi, no BLE commissioning needed)

  # ============================================================================
  # Frigate -- ENABLED 2026-07-28 (basic: 2 cameras, person detect). OpenVINO on HD 630 iGPU.
  # ============================================================================
  frigate:
    container_name: frigate
    image: ghcr.io/blakeblackshear/frigate:stable
    restart: unless-stopped
    stop_grace_period: 30s
    shm_size: "512mb"
    devices:
      - /dev/dri/renderD128         # HD 630: OpenVINO detect + VAAPI decode
    group_add:
      - "993"                       # render GID (confirmed via `getent group render`)
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./frigate/config:/config
      - frigate_media:/media/frigate      # Docker-managed cifs volume (see bottom). HARDENED: if the NAS
                                          # is unreachable, Docker refuses to start Frigate rather than
                                          # writing recordings to local disk (the old bind-mount risk).
      - type: tmpfs                 # cache in RAM
        target: /tmp/cache
        tmpfs: { size: "1g" }
    ports:
      - "8971:8971"                 # authenticated UI
      - "127.0.0.1:5000:5000"       # internal unauth API, localhost ONLY -> for the HA frigate integration
      - "8554:8554"                 # RTSP restream
      - "8555:8555/tcp"
      - "8555:8555/udp"             # WebRTC
    environment:
      FRIGATE_RTSP_PASSWORD: "${FRIGATE_RTSP_PASSWORD}"   # = Reolink admin pw (in .env)
      FRIGATE_MQTT_USER: "${MQTT_USER}"
      FRIGATE_MQTT_PASSWORD: "${MQTT_PASSWORD}"
      LIBVA_DRIVER_NAME: "iHD"
    depends_on: [mosquitto]

  # ============================================================================
  # SLZB-06 ZIGBEE COORDINATOR (CC2652P, LAN mode, central floor 1) -- ONLINE 2026-07 @ 192.168.50.21.
  # Talks to the coordinator over TCP:6638 -- NO USB passthrough, so no /dev or /run/udev mounts.
  # ============================================================================
  zigbee2mqtt:
    container_name: zigbee2mqtt
    image: ghcr.io/koenkk/zigbee2mqtt:latest
    restart: unless-stopped
    volumes:
      - ./zigbee2mqtt/data:/app/data
    ports:
      - "8080:8080"                 # Z2M web UI
    environment:
      TZ: "${TZ}"
      # MQTT creds injected from .env -> kept OUT of configuration.yaml
      ZIGBEE2MQTT_CONFIG_MQTT_USER: "${MQTT_USER}"
      ZIGBEE2MQTT_CONFIG_MQTT_PASSWORD: "${MQTT_PASSWORD}"
    depends_on: [mosquitto]

  # Audio: NO snapserver. The NuTone IM-3303 is reused as-is, fed by a standalone WiiM at its
  # AUX input (whole-house mono, lo-fi accepted). Nothing audio-related runs on masn.

volumes:
  postgres:
  # NAS recordings share, mounted BY DOCKER (not fstab) so the container won't start without it.
  # Docker's cifs driver calls mount(2) directly (no mount.cifs helper), so creds must be INLINE
  # username=/password= (a credentials=<file> is silently ignored -> permission denied). Values come
  # from .env at `docker compose up` time (not written in this file). NAS_IP/SHARE from .env; vers 3.1.1.
  frigate_media:
    driver: local
    driver_opts:
      type: cifs
      o: "username=${NAS_FRIGATE_SMB_USER},password=${NAS_FRIGATE_SMB_PASSWORD},uid=0,gid=0,file_mode=0664,dir_mode=0775,vers=3.1.1"
      device: "//${NAS_IP}/${NAS_FRIGATE_SHARE}"
