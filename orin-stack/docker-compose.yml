# Orin Frigate stack -- /opt/stack/docker-compose.yml on orin.internal (192.168.50.200)
#
# PHASE 2 SHADOW (docs/orin-frigate-migration.md section 5): this runs ALONGSIDE masn's Frigate,
# watching the same six cameras, so the Orin can be measured on real traffic before anything cuts
# over. Frigate ONLY -- mosquitto, Home Assistant, postgres, matter-server and zigbee2mqtt all stay
# on masn permanently (that was decided 2026-08-05, plan section 7: two boxes mean one can die and
# the house still works).
#
# Deliberately NOT a copy of masn's compose file. The differences that matter:
#   - `runtime: nvidia`      -- the whole point; masn passes /dev/dri instead
#   - no `devices:` block    -- the nvidia runtime injects the GPU nodes itself
#   - MQTT points at masn    -- the broker does not move
#   - separate NAS subdir    -- so a shadow run cannot write over masn's recordings
#   - :5000 stays on loopback, same as masn: it is the UNAUTHENTICATED API

services:
  frigate:
    container_name: frigate
    # PINNED, not `stable-tensorrt-jp6`. This box becomes must-never-be-down at cutover, and an
    # unattended image change is exactly the failure this pin exists to prevent.
    image: ghcr.io/blakeblackshear/frigate:0.17.2-tensorrt-jp6
    restart: unless-stopped
    stop_grace_period: 30s
    shm_size: "512mb"

    # Provided by nvidia-container-toolkit. It must be REGISTERED with the daemon --
    # `sudo nvidia-ctk runtime configure --runtime=docker && sudo systemctl restart docker`.
    # JetPack installs the packages but does NOT wire them into Docker; verified missing on this
    # board 2026-08-07 (no /etc/docker/daemon.json at all).
    runtime: nvidia

    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./frigate/config:/config
      - frigate_media:/media/frigate
      - type: tmpfs
        target: /tmp/cache
        tmpfs: { size: "1g" }

    ports:
      - "8971:8971"                 # authenticated UI
      # CUTOVER 2026-08-09: :5000 is the UNAUTHENTICATED API and was loopback-only, like masn's.
      # Home Assistant lives on masn and needs it -- `rest_command.frigate_get_event` fetches
      # /api/events/<id> for the vehicle directness gate, and the Frigate integration polls it.
      # Bound to the Orin's LAN IP rather than 0.0.0.0 so it is NOT on the tailnet, and gated to
      # masn's IP ONLY by a host firewall rule (setup-orin.sh installs it). Two controls, because
      # the port binding alone would expose an unauthenticated API to every device on the LAN.
      - "${ORIN_LAN_IP}:5000:5000"
      - "8554:8554"                 # RTSP restream
      - "8555:8555/tcp"
      - "8555:8555/udp"             # WebRTC

    environment:
      FRIGATE_RTSP_PASSWORD: "${FRIGATE_RTSP_PASSWORD}"
      # The broker stays on masn. Its mosquitto binds 127.0.0.1 + ${MASN_LAN_IP} explicitly (never
      # 0.0.0.0, which would also expose it on the tailnet) -- that LAN binding exists for this.
      FRIGATE_MQTT_HOST: "${MASN_LAN_IP}"
      FRIGATE_MQTT_USER: "${MQTT_USER}"
      FRIGATE_MQTT_PASSWORD: "${MQTT_PASSWORD}"
      PLUS_API_KEY: "${PLUS_API_KEY:-}"
      # No LIBVA_DRIVER_NAME: that is the Intel iHD VAAPI driver and means nothing on Jetson.

volumes:
  # CUTOVER 2026-08-09: the REAL recordings share, replacing the `orin-shadow` scratch directory.
  #
  # DELIBERATELY A NEW VOLUME NAME (`frigate_media`, was `frigate_media_shadow`). Docker does NOT
  # re-read driver_opts on an existing named volume -- editing the device path in place is silently
  # ignored and it keeps mounting the OLD target. Renaming is what forces the new mount. It also
  # leaves the shadow volume intact for rollback; remove it and the `orin-shadow` directory only
  # after masn has been cold for a week.
  #
  # Same hardening as masn: Docker mounts the share itself, so if the NAS is unreachable Docker
  # refuses to start Frigate instead of quietly filling the local NVMe. (See frigate-stack.service
  # for the boot-ordering retry that makes this survive a reboot.)
  # Docker's cifs driver calls mount(2) directly (no mount.cifs helper), so credentials must be
  # INLINE username=/password= -- a credentials=<file> is silently ignored and yields permission
  # denied. Values come from .env at `docker compose up` time, never written into this file.
  frigate_media:
    driver: local
    driver_opts:
      type: cifs
      o: "username=${NAS_FRIGATE_SMB_USER},password=${NAS_FRIGATE_SMB_PASSWORD},uid=0,gid=0,file_mode=0664,dir_mode=0775,vers=3.1.1"
      device: "//${NAS_IP}/${NAS_FRIGATE_SHARE}"
